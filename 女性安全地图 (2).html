<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女性安全地图 | W-Safe Demo</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --bg-glass: rgba(255, 255, 255, 0.90);
            --bg-glass-dark: rgba(20, 20, 25, 0.85);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; color: var(--text-main); }

        /* --- 地图层 --- */
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* --- 引导页/城市选择遮罩 (Onboarding) --- */
        #city-selector-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(240, 240, 250, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #city-selector-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .selector-card {
            background: white;
            width: 90%;
            max-width: 800px;
            padding: 40px;
            border-radius: 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
        }

        .selector-header h2 { font-size: 2rem; margin-bottom: 8px; color: var(--text-main); }
        .selector-header p { color: var(--text-sub); margin-bottom: 32px; }

        .city-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }

        .city-option {
            background: #f9fafb;
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            padding: 20px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .city-option:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .city-flag { font-size: 2rem; }
        .city-name { font-weight: 600; font-size: 1rem; }
        .city-country { font-size: 0.75rem; color: var(--text-sub); }

        /* --- 左侧控制面板 --- */
        .control-panel {
            position: absolute;
            top: 24px; left: 24px; width: 360px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            padding: 24px;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.4);
            transform: translateX(0);
            transition: transform 0.3s ease;
        }

        /* 隐藏面板时的样式 (可选) */
        .control-panel.collapsed { transform: translateX(-120%); }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 6px; }
        .brand span { color: var(--accent); }
        
        /* 切换城市小按钮 */
        .btn-switch-city {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 20px;
            transition: all 0.2s;
        }
        .btn-switch-city:hover { background: var(--primary); color: white; }

        .current-location-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 600;
        }

        /* 搜索框 */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-input {
            width: 100%; padding: 12px 16px 12px 42px;
            border-radius: 14px; border: 1px solid #e5e7eb;
            background: white; outline: none; transition: 0.2s;
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5; }

        /* 过滤器开关 */
        .toggle-group {
            background: rgba(0,0,0,0.05);
            padding: 4px;
            border-radius: 14px;
            display: flex;
            margin-bottom: 20px;
        }
        .toggle-btn {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.3s;
        }
        .toggle-btn.active { background: white; color: var(--primary); shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* 动态数据面板 */
        .city-stats {
            background: white;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid #f3f4f6;
        }
        .stat-item {
            display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem;
        }
        .stat-item:last-child { margin-bottom: 0; }
        .tag-safe { color: #10b981; font-weight: 600; }
        
        /* 移动端适配 */
        @media (max-width: 600px) {
            .control-panel { top: auto; bottom: 0; left: 0; width: 100%; border-radius: 24px 24px 0 0; padding-bottom: 40px; }
            .selector-card { width: 95%; padding: 24px; }
            .city-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        /* Popup 样式微调 */
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; overflow: hidden; }
        .custom-popup .leaflet-popup-content { margin: 0; width: 260px !important; }
        .popup-head { background: var(--primary); padding: 12px 16px; color: white; }
        .popup-body { padding: 16px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="city-selector-overlay">
        <div class="selector-card">
            <div class="selector-header">
                <h2>🌍 开启您的安全旅程</h2>
                <p>选择目的地，查看当地女性安全评价数据</p>
            </div>
            <div class="city-grid">
                <div class="city-option" onclick="selectCity('shanghai')">
                    <span class="city-flag">🇨🇳</span>
                    <span class="city-name">上海</span>
                    <span class="city-country">Shanghai</span>
                </div>
                <div class="city-option" onclick="selectCity('guiyang')">
                    <span class="city-flag">🇨🇳</span>
                    <span class="city-name">贵阳</span>
                    <span class="city-country">Guiyang</span>
                </div>
                <div class="city-option" onclick="selectCity('banna')">
                    <span class="city-flag">🇨🇳</span>
                    <span class="city-name">西双版纳</span>
                    <span class="city-country">Xishuangbanna</span>
                </div>
                <div class="city-option" onclick="selectCity('bangkok')">
                    <span class="city-flag">🇹🇭</span>
                    <span class="city-name">曼谷</span>
                    <span class="city-country">Bangkok</span>
                </div>
                <div class="city-option" onclick="selectCity('naples')">
                    <span class="city-flag">🇮🇹</span>
                    <span class="city-name">那不勒斯</span>
                    <span class="city-country">Napoli</span>
                </div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="header-row">
            <div class="brand">🛡️ W-Safe <span>Map</span></div>
            <div class="btn-switch-city" onclick="showCitySelector()">切换城市</div>
        </div>

        <div class="current-location-badge">
            <span>📍</span> <span id="current-city-label">正在定位...</span>
        </div>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索此区域的安全酒店..." id="search-input">
        </div>

        <div class="toggle-group">
            <div class="toggle-btn active" id="btn-heat" onclick="setMode('heat')">安全热力</div>
            <div class="toggle-btn" id="btn-marker" onclick="setMode('marker')">酒店评价</div>
        </div>

        <div class="city-stats" id="city-stats-box">
            </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <script>
        // --- 配置数据：5个 Demo 城市 ---
        // 包含中心坐标、默认缩放、以及该城市的特色安全标签（用于模拟数据）
        const CITY_CONFIG = {
            shanghai: {
                name: "上海",
                center: [31.2304, 121.4737],
                zoom: 13,
                tags: ["24h便利店", "路灯明亮", "警务站多"],
                baseScore: 9.2,
                desc: "超一线城市，夜间出行安全性极高。"
            },
            guiyang: {
                name: "贵阳",
                center: [26.6470, 106.6302],
                zoom: 13,
                tags: ["夜市繁华", "人流密集", "监控覆盖"],
                baseScore: 8.8,
                desc: "避暑之都，夜生活丰富，主要商圈非常安全。"
            },
            banna: {
                name: "西双版纳 (景洪)",
                center: [22.0088, 100.7963],
                zoom: 14,
                tags: ["景区安保", "民宿老板友好", "结伴出行"],
                baseScore: 8.5,
                desc: "热门旅游地，告庄区域夜间极其热闹，安全性较高。"
            },
            bangkok: {
                name: "曼谷",
                center: [13.7563, 100.5018],
                zoom: 13,
                tags: ["游客警署", "Grab便捷", "酒店前台24h"],
                baseScore: 7.8,
                desc: "需注意突突车宰客，建议选择轻轨沿线住宿。"
            },
            naples: {
                name: "那不勒斯",
                center: [40.8518, 14.2681],
                zoom: 13,
                tags: ["古城警力", "主街照明", "热门景点"],
                baseScore: 7.2,
                desc: "欧洲风情浓厚，建议避开火车站周边偏僻小巷。"
            }
        };

        // --- 初始化地图 ---
        const map = L.map('map', { zoomControl: false }).setView([31.2304, 121.4737], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '©OpenStreetMap, ©CartoDB',
            maxZoom: 20
        }).addTo(map);

        // --- 全局变量 ---
        let heatLayer = null;
        let markerLayer = L.layerGroup().addTo(map);
        let currentMode = 'heat';
        let currentCityKey = 'shanghai';

        // --- 核心功能：生成模拟数据 ---
        // 为了让Demo在任何城市都有数据，我们围绕城市中心随机生成点位
        function generateDemoData(cityKey) {
            const city = CITY_CONFIG[cityKey];
            const points = [];
            const [baseLat, baseLng] = city.center;
            
            // 生成 50 个数据点
            for(let i=0; i<50; i++) {
                // 随机偏移 (大约 5km 范围内)
                const lat = baseLat + (Math.random() - 0.5) * 0.06;
                const lng = baseLng + (Math.random() - 0.5) * 0.06;
                // 分数波动
                const score = (city.baseScore + (Math.random() - 0.5) * 2).toFixed(1);
                // 随机标签
                const randomTag = city.tags[Math.floor(Math.random() * city.tags.length)];
                
                points.push({
                    lat: lat,
                    lng: lng,
                    intensity: Math.random() * 0.5 + 0.5, // 0.5 - 1.0
                    name: `${city.name}精选住宿 #${i+1}`,
                    score: score > 10 ? 10 : score,
                    tag: randomTag
                });
            }
            return points;
        }

        // --- 核心功能：渲染地图数据 ---
        function renderCity(cityKey) {
            const city = CITY_CONFIG[cityKey];
            const data = generateDemoData(cityKey);

            // 1. 清理旧图层
            if(heatLayer) map.removeLayer(heatLayer);
            markerLayer.clearLayers();

            // 2. 准备热力图数据
            const heatPoints = data.map(p => [p.lat, p.lng, p.intensity * 20]); // 放大强度以便视觉明显
            heatLayer = L.heatLayer(heatPoints, {
                radius: 35, blur: 20,
                gradient: {0.4: '#6366f1', 0.6: '#a855f7', 0.8: '#ec4899', 1.0: '#f43f5e'} // 紫-粉-红 渐变
            });

            // 3. 准备 Marker 数据
            data.forEach(p => {
                if (p.score > 8.0) { // 只标记高分酒店
                    const popupContent = `
                        <div class="popup-head">
                            <div style="font-weight:700; font-size:1rem;">${p.name}</div>
                            <div style="font-size:0.8rem; opacity:0.9;">⭐ 安全评分: ${p.score}</div>
                        </div>
                        <div class="popup-body">
                            <div style="color:#6b7280; margin-bottom:4px;">用户好评标签:</div>
                            <span style="background:#d1fae5; color:#065f46; padding:2px 6px; border-radius:4px; font-size:0.8rem;">${p.tag}</span>
                            <div style="margin-top:10px; font-size:0.8rem; color:#4b5563;">
                                "位置很好，${city.tags[0]}，晚上回来也很有安全感。"
                            </div>
                        </div>
                    `;
                    L.marker([p.lat, p.lng]).bindPopup(popupContent, {className: 'custom-popup'}).addTo(markerLayer);
                }
            });

            // 4. 根据当前模式显示图层
            if (currentMode === 'heat') {
                heatLayer.addTo(map);
                map.removeLayer(markerLayer);
            } else {
                markerLayer.addTo(map);
            }

            // 5. 更新 UI 文本
            document.getElementById('current-city-label').innerText = city.name + ", " + (cityKey === 'naples' || cityKey === 'bangkok' ? '海外' : '中国');
            document.getElementById('search-input').placeholder = `在${city.name}搜索...`;
            
            // 更新统计面板
            const statsHtml = `
                <div class="stat-item">
                    <span style="color:#6b7280">综合安全指数</span>
                    <span class="tag-safe">${city.baseScore} / 10.0</span>
                </div>
                <div class="stat-item">
                    <span style="color:#6b7280">主要优势</span>
                    <span>${city.tags[0]}</span>
                </div>
                <div style="margin-top:8px; padding-top:8px; border-top:1px dashed #eee; font-size:0.8rem; color:#6b7280;">
                    💡 ${city.desc}
                </div>
            `;
            document.getElementById('city-stats-box').innerHTML = statsHtml;
        }

        // --- 交互逻辑 ---

        // 1. 选择城市 (入口)
        function selectCity(key) {
            currentCityKey = key;
            const city = CITY_CONFIG[key];

            // 隐藏遮罩
            document.getElementById('city-selector-overlay').classList.add('hidden');
            
            // 地图飞行效果
            map.flyTo(city.center, city.zoom, {
                duration: 2.5, // 飞行时间
                easeLinearity: 0.25
            });

            // 渲染数据
            renderCity(key);
        }

        // 2. 重新显示选择器
        function showCitySelector() {
            document.getElementById('city-selector-overlay').classList.remove('hidden');
        }

        // 3. 切换热力/标记模式
        function setMode(mode) {
            currentMode = mode;
            
            // 按钮样式
            document.getElementById('btn-heat').className = mode === 'heat' ? 'toggle-btn active' : 'toggle-btn';
            document.getElementById('btn-marker').className = mode === 'marker' ? 'toggle-btn active' : 'toggle-btn';

            if (mode === 'heat') {
                if(heatLayer) map.addLayer(heatLayer);
                map.removeLayer(markerLayer);
            } else {
                if(heatLayer) map.removeLayer(heatLayer);
                map.addLayer(markerLayer);
            }
        }

    </script>
</body>
</html>
