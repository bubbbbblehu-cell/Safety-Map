<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转到 Coze 智能体</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI 安全检测</h1>
        <p>点击下方按钮，跳转到 Coze 智能体进行专业的酒店安全检测分析</p>
        
        <a href="https://www.coze.cn/space/7383534396151693331/bot/7588350694353649679" 
           class="btn" 
           target="_blank">
            前往 Coze 智能体
        </a>
        
        <div class="info">
            <strong>使用说明：</strong><br>
            1. 点击按钮打开 Coze 智能体<br>
            2. 上传您拍摄的酒店照片<br>
            3. 描述您要检测的部位（门锁、窗户、镜子等）<br>
            4. AI 将为您提供专业的安全分析
        </div>
    </div>
    
    <script>
        // 3秒后自动跳转
        setTimeout(() => {
            if (confirm('即将跳转到 Coze 智能体，是否继续？')) {
                window.open('https://www.coze.cn/space/7383534396151693331/bot/7588350694353649679', '_blank');
            }
        }, 3000);
    </script>
</body>
</html>
