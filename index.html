<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女性安全地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
        }

        /* 开屏页 */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        #splash-screen h1 {
            color: white;
            font-size: 32px;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-height: 80%;
            width: 90%;
            max-width: 400px;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
        }

        .close-button {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .close-button:hover {
            color: #333;
        }

        /* 城市选择 */
        .city-selection {
            padding: 20px;
        }

        .country-section {
            margin-bottom: 20px;
        }

        .country-title {
            font-size: 16px;
            font-weight: 600;
            color: #6366f1;
            margin-bottom: 12px;
        }

        .cities-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .city-button {
            background: #f5f5f5;
            padding: 16px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .city-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-color: #6366f1;
        }

        .city-button-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .city-button-count {
            font-size: 12px;
            color: #999;
        }

        /* 地图页面 */
        .map-container {
            width: 100%;
            height: 100vh;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 版本号 */
        .version {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ff00;
            color: black;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- 开屏页 -->
    <div id="splash-screen">
        <h1>女性安全地图</h1>
    </div>

    <!-- 城市选择模态框 -->
    <div class="modal-overlay active" id="cityModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">选择城市</div>
                <div class="close-button" id="closeCityModal">×</div>
            </div>
            <div class="city-selection">
                <div class="country-section">
                    <div class="country-title">中国</div>
                    <div class="cities-container">
                        <div class="city-button" onclick="selectCity('xishuangbanna', '西双版纳')">
                            <div class="city-button-text">西双版纳</div>
                            <div class="city-button-count">点击选择</div>
                        </div>
                        <div class="city-button" onclick="selectCity('guiyang', '贵阳')">
                            <div class="city-button-text">贵阳</div>
                            <div class="city-button-count">点击选择</div>
                        </div>
                        <div class="city-button" onclick="selectCity('shanghai', '上海')">
                            <div class="city-button-text">上海</div>
                            <div class="city-button-count">点击选择</div>
                        </div>
                    </div>
                </div>
                <div class="country-section">
                    <div class="country-title">泰国</div>
                    <div class="cities-container">
                        <div class="city-button" onclick="selectCity('bangkok', '曼谷')">
                            <div class="city-button-text">曼谷</div>
                            <div class="city-button-count">点击选择</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 地图容器 -->
    <div class="map-container" id="mapContainer" style="display: none;">
        <div id="map"></div>
    </div>

    <!-- 版本号 -->
    <div class="version">v6.0 全新简化版</div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        console.log('🚀 页面加载开始');

        // Supabase配置
        const { createClient } = supabase;
        const SUPABASE_URL = 'https://hmmruoankhohowlzajll.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtbXJ1b2Fua2hvaG93bHphamxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1MjQxNjgsImV4cCI6MjA4NjEwMDE2OH0.nGVgFlrTPQh86Ba0doT_mmeHvCnF0NjJ6MUJEvQKV3g';
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map = null;
        let currentCity = null;

        // 城市坐标
        const cityCoords = {
            'xishuangbanna': { lat: 22.0084, lng: 100.7979, zoom: 13 },
            'guiyang': { lat: 26.6470, lng: 106.6302, zoom: 13 },
            'shanghai': { lat: 31.2304, lng: 121.4737, zoom: 13 },
            'bangkok': { lat: 13.7563, lng: 100.5018, zoom: 13 }
        };

        // 选择城市
        function selectCity(cityId, cityName) {
            console.log('选择城市:', cityName);
            currentCity = { id: cityId, name: cityName };
            
            // 隐藏模态框
            document.getElementById('cityModal').classList.remove('active');
            
            // 显示地图
            document.getElementById('mapContainer').style.display = 'block';
            
            // 初始化地图
            initMap(cityId);
        }

        // 初始化地图
        async function initMap(cityId) {
            console.log('初始化地图:', cityId);
            
            const coords = cityCoords[cityId];
            if (!coords) {
                console.error('找不到城市坐标');
                return;
            }

            // 创建地图
            if (map) {
                map.remove();
            }

            map = L.map('map').setView([coords.lat, coords.lng], coords.zoom);

            // 添加地图瓦片
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            console.log('地图创建成功');

            // 加载酒店数据
            loadHotels(cityId);
        }

        // 加载酒店数据
        async function loadHotels(cityId) {
            console.log('加载酒店数据...');
            
            try {
                const { data, error } = await supabaseClient
                    .from('hotels')
                    .select('*')
                    .eq('is_active', true);

                if (error) {
                    console.error('加载失败:', error);
                    return;
                }

                console.log('成功加载', data.length, '个酒店');

                // 添加标记
                data.forEach(hotel => {
                    if (hotel.latitude && hotel.longitude) {
                        const marker = L.marker([hotel.latitude, hotel.longitude])
                            .addTo(map)
                            .bindPopup(`<b>${hotel.name}</b><br>评分: ${hotel.safety_score}`);
                    }
                });

            } catch (err) {
                console.error('加载酒店出错:', err);
            }
        }

        // 关闭模态框
        document.getElementById('closeCityModal').addEventListener('click', () => {
            document.getElementById('cityModal').classList.remove('active');
        });

        // 开屏页处理
        window.addEventListener('load', () => {
            console.log('页面加载完成');
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.remove();
                        console.log('开屏页已移除，模态框应该可见');
                    }, 800);
                }
            }, 2000);
        });
    </script>
</body>
</html>
